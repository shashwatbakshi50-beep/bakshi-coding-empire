<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bakshi Coding Empire</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: gold;
}

nav {
  display: none;
  justify-content: space-between;
  padding: 15px;
  border-bottom: 1px solid gold;
}

nav a {
  color: gold;
  margin: 0 10px;
  text-decoration: none;
}

#home {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#logo {
  width: 150px;
  transition: 0.7s;
}

.top {
  position: absolute;
  top: 10px;
  width: 80px;
}

button {
  padding: 10px 20px;
  background: gold;
  border: none;
  cursor: pointer;
  margin-top: 10px;
}

section {
  padding: 40px;
  display: none;
}

.active {
  display: block;
}

.card {
  background: #111;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
}

.grid {
  display: flex;
  flex-wrap: wrap;
}

input {
  padding: 10px;
  width: 100%;
  margin-bottom: 20px;
  background: #222;
  color: gold;
  border: none;
}
</style>

</head>

<body>

<!-- HOME -->
<div id="home">
  <img src="logo.png" id="logo">
  <button onclick="explore()">Explore</button>
</div>

<!-- NAVBAR -->
<nav id="navbar">
  <h2>Bakshi Coding Empire</h2>
  <div>
    <a onclick="show('store')">Store</a>
    <a onclick="show('books')">Books</a>
    <a onclick="show('about')">About</a>
    <a onclick="show('donate')">Donate</a>
    <a onclick="show('gallery')">Gallery</a>
    <a onclick="show('login')">Login</a>
  </div>
</nav>

<!-- STORE -->
<section id="store">
  <h1>🎮 Game Store</h1>

  <input type="text" placeholder="Search..." onkeyup="searchGame(this.value)">

  <div class="grid" id="games"></div>
</section>

<!-- BOOKS -->
<section id="books">
  <h1>📚 Books</h1>
  <div class="card">Book 1</div>
</section>

<!-- ABOUT -->
<section id="about">
  <h1>👤 About</h1>
  <p>CEO of Bakshi Coding Empire 🚀</p>
</section>

<!-- DONATE -->
<section id="donate">
  <h1>🐾 Donate</h1>
  <button onclick="alert('Add Razorpay')">Donate Now</button>
</section>

<!-- GALLERY -->
<section id="gallery">
  <h1>🖼 Gallery</h1>
</section>

<!-- LOGIN -->
<section id="login">
  <h1>🔐 Login</h1>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>
</section>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* HOME */
function explore() {
  document.getElementById("logo").classList.add("top");

  setTimeout(() => {
    document.getElementById("home").style.display = "none";
    document.getElementById("navbar").style.display = "flex";
    show('store');
    loadGames();
  }, 800);
}

/* NAVIGATION */
function show(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* LOGIN */
function login() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => alert("Login Success 🔥"))
    .catch(e => alert(e.message));
}

/* SIGNUP */
function signup() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => alert("Account Created 🚀"))
    .catch(e => alert(e.message));
}

/* LOAD GAMES FROM FIREBASE */
function loadGames() {
  db.collection("games").get().then(snapshot => {
    let container = document.getElementById("games");
    container.innerHTML = "";

    snapshot.forEach(doc => {
      let game = doc.data();

      container.innerHTML += `
        <div class="card">
          ${game.name}<br>
          <button onclick="buy()">Buy</button>
          <button onclick="download('${game.link}')">Download</button>
        </div>
      `;
    });
  });
}

/* SEARCH */
function searchGame(val) {
  document.querySelectorAll("#games .card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(val.toLowerCase())
      ? "block" : "none";
  });
}

/* BUY */
function buy() {
  alert("Connect Razorpay 💳");
}

/* DOWNLOAD */
function download(link) {
  window.open(link, "_blank");
}
</script>

</body>
</html>
